name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiagent
          POSTGRES_PASSWORD: aiagent
          POSTGRES_DB: aiagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aiagent -d aiagent_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://aiagent:aiagent@localhost:5432/aiagent_test
          DATABASE_URL: postgresql://aiagent:aiagent@localhost:5432/aiagent_test
          PINECONE_API_KEY: test-key
          RETRIEVAL_TOP_K: 5
          RETRIEVAL_SCORE_THRESHOLD: 0.3
          MAX_FILE_SIZE: 10485760
          MAX_PDF_PAGES: 200
          OLLAMA_MODEL: qwen3.5:9b
          OLLAMA_HOST: http://localhost:11434
        run: |
          pytest -q